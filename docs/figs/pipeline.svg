<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" width="920" height="300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="920" height="300" rx="10" fill="#fbfaf8"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1b1a18">From raw laser scans to an interactive web model</text>
  <text x="24" y="54" font-size="11.5" fill="#6b6660">Each box removes data that cannot be rendered in a browser, while recording what was measured. Figures are typical for one statue.</text>

  <g stroke="#3a3a3a" stroke-width="1.1" fill="#ffffff">
    <rect x="24"  y="78" width="196" height="64" rx="7"/>
    <rect x="262" y="78" width="196" height="64" rx="7"/>
    <rect x="500" y="78" width="196" height="64" rx="7"/>
    <rect x="738" y="78" width="158" height="64" rx="7"/>
    <rect x="24"  y="196" width="196" height="64" rx="7"/>
    <rect x="262" y="196" width="196" height="64" rx="7"/>
    <rect x="500" y="196" width="196" height="64" rx="7"/>
    <rect x="738" y="196" width="158" height="64" rx="7"/>
  </g>

  <g font-size="12.5" font-weight="600" fill="#1b1a18">
    <text x="38" y="100">1 · Capture</text>
    <text x="276" y="100">2 · Register</text>
    <text x="514" y="100">3 · Clean + subsample</text>
    <text x="752" y="100">4 · Normals</text>
    <text x="38" y="218">5 · Poisson mesh</text>
    <text x="276" y="218">6 · Density filter</text>
    <text x="514" y="218">7 · Decimate + bake</text>
    <text x="752" y="218">8 · Publish</text>
  </g>

  <g font-size="10.5" fill="#6b6660">
    <text x="38" y="117">TLS stations around object</text>
    <text x="38" y="132">.fls / .e57 · 4–6 setups</text>
    <text x="276" y="117">SCENE or CloudCompare</text>
    <text x="276" y="132">one cloud · 13 M points</text>
    <text x="514" y="117">SOR + space 2 mm</text>
    <text x="514" y="132">3 M points</text>
    <text x="752" y="117">quadric, r≈3–5× spacing</text>
    <text x="752" y="132">orient by MST</text>
    <text x="38" y="235">depth 11 + density SF</text>
    <text x="38" y="250">6 M triangles</text>
    <text x="276" y="235">cut invented surface</text>
    <text x="276" y="250">holes restored</text>
    <text x="514" y="235">Blender, 50 k tris</text>
    <text x="514" y="250">2048 px normal + colour</text>
    <text x="752" y="235">GLB + Draco · 9 MB</text>
    <text x="752" y="250">model-viewer on Pages</text>
  </g>

  <g stroke="#8a6a3f" stroke-width="1.6" fill="none" marker-end="url(#ar)">
    <path d="M220,110 L256,110"/>
    <path d="M458,110 L494,110"/>
    <path d="M696,110 L732,110"/>
    <path d="M817,142 L817,160 L122,160 L122,190"/>
    <path d="M220,228 L256,228"/>
    <path d="M458,228 L494,228"/>
    <path d="M696,228 L732,228"/>
  </g>

  <g font-size="10" fill="#8a6a3f">
    <text x="24" y="286">CloudCompare (open source)  ·  stages 2–6</text>
    <text x="500" y="286">Blender + glTF (open source)  ·  stages 7–8</text>
  </g>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#8a6a3f"/>
    </marker>
  </defs>
</svg>
